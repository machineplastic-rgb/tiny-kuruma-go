*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#ffd23f}
body{font-family:'Shantell Sans',sans-serif;color:#111;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* bloques de color puro con forma irregular (igual que en el juego) */
.blk{position:relative;border:none;overflow:hidden;color:#111;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;min-width:0;min-height:0;transition:transform .12s}
button.blk:active{transform:scale(.95)}
.lbl{font-family:'Super Waffles',sans-serif;font-weight:400;line-height:.88;text-transform:uppercase}
.sh{display:inline-block;animation:shiver .42s steps(1) infinite}
@keyframes shiver{0%{transform:rotate(-2.5deg)}33%{transform:rotate(2deg) translate(.6px,-.8px)}66%{transform:rotate(-1deg) translate(-.6px,.6px)}}
.w{display:inline-block;white-space:nowrap}

#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,36vw,470px);grid-template-areas:"map side";padding:12px}
#top{position:absolute;left:12px;top:12px;z-index:6;display:flex;gap:8px;align-items:flex-start}
.sq{width:52px;height:52px;padding:0;justify-content:center;align-items:center;flex:none}
.sq svg{width:24px;height:24px;position:relative;z-index:2}
.ttl{padding:12px 18px 14px 16px;color:#fbe9c9}
.ttl .lbl{font-size:clamp(20px,4.4vh,40px)}
.ttl .ln{display:block}
.ttl small{display:block;font-family:'Yusei Magic';font-size:clamp(11px,1.7vh,14px);margin-top:6px}
#mapBox{grid-area:map;position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:manipulation}
#openAll{position:absolute;left:4px;bottom:4px;z-index:5;padding:10px 14px 11px;color:#fbe9c9;font-weight:800;font-size:12px;letter-spacing:.02em}
#side{grid-area:side;position:relative;min-height:0;display:flex;padding:2px 0 2px 12px}
#panel{flex:1;gap:10px;justify-content:flex-start;padding:clamp(22px,3.4vh,34px) clamp(22px,2.4vw,32px) clamp(24px,3.6vh,36px);overflow-y:auto;overflow-x:hidden;cursor:default}
#panel>*{flex-shrink:0}
#panel>.pArt{flex:1 1 auto}
.pHead{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;font-family:'Super Waffles';font-size:clamp(16px,2.4vh,22px)}
.pLock{display:flex;align-items:center;gap:6px;font-family:'Shantell Sans';font-weight:800;font-size:clamp(11px,1.6vh,13px);text-align:right}
.pLock svg{width:16px;height:16px;flex:none}
.pName{font-size:clamp(38px,min(5.2vw,8vh),78px)}
.pJp{font-family:'Yusei Magic';font-size:clamp(17px,2.6vh,26px);margin-top:-4px}
.pTag{font-weight:700;font-size:clamp(13px,1.9vh,17px);line-height:1.25}
.pArt{width:100%;flex:1 1 auto;min-height:80px;max-height:30vh}
.sub{width:100%;padding:14px 18px 16px;gap:4px;font-size:clamp(13px,1.8vh,16px);font-weight:700;line-height:1.25}
.subT{font-family:'Super Waffles';font-weight:400;font-size:clamp(17px,2.4vh,22px);text-transform:uppercase;line-height:1}
.pRow{display:flex;gap:10px;width:100%}
.pRow .blk{flex:1;padding:14px 16px 16px;justify-content:center}
#pSnd{flex-direction:row;align-items:center;gap:8px;font-weight:800;font-size:clamp(12px,1.7vh,14px);line-height:1.15}
#pSnd svg{width:22px;height:22px;flex:none}
#pPlay .lbl{font-size:clamp(26px,4vh,38px)}
.pIn>*{animation:pIn .55s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i,0)*55ms + 120ms)}
@keyframes pIn{from{transform:translateY(28px) rotate(-3deg);opacity:0}}
.nope{animation:nope .4s}
@keyframes nope{20%{transform:translateX(-8px) rotate(-2deg)}50%{transform:translateX(7px) rotate(2deg)}80%{transform:translateX(-4px)}}

/* mapa */
.zone{cursor:pointer;outline:none}
.zin{transform-box:fill-box;transform-origin:center;animation:zIn .75s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0ms)}
@keyframes zIn{from{transform:scale(0) rotate(-22deg)}}
.zone.out .zin{animation:zOut .45s cubic-bezier(.55,0,.85,.35) both;animation-delay:var(--o,0ms)}
@keyframes zOut{to{transform:scale(0) rotate(28deg)}}
.zs{transform-box:fill-box;transform-origin:center}
.zone.sel .zs{animation:selB 1.1s ease-in-out infinite alternate}
@keyframes selB{from{transform:scale(1.05) rotate(-1.6deg)}to{transform:scale(1.1) rotate(1.6deg)}}
.zn{font-family:'Super Waffles';font-size:34px;text-transform:uppercase}
.znum{font-family:'Super Waffles';font-size:19px}
.zjp{font-family:'Yusei Magic';font-size:19px}
.dim{opacity:.42}
.zlock{transform-box:fill-box;transform-origin:center}
.zlock.pop{animation:lockPop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes lockPop{from{transform:scale(0)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.5,0,.3,1) forwards;animation-delay:var(--d,0ms)}
@keyframes draw{to{stroke-dashoffset:0}}
.march{animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-58}}
.landIn{transform-box:fill-box;transform-origin:center;animation:landIn .7s cubic-bezier(.2,1.2,.4,1) both}
@keyframes landIn{from{transform:scale(.9);opacity:0}}
.ono{font-family:'Matcha Style';font-size:34px;fill:#111;stroke:#fbe9c9;stroke-width:7;paint-order:stroke;stroke-linejoin:round;transform-box:fill-box;transform-origin:center;animation:ono 1.2s cubic-bezier(.2,1.4,.4,1) forwards;pointer-events:none}
@keyframes ono{0%{opacity:0;transform:translateY(10px) scale(.3) rotate(-10deg)}22%{opacity:1;transform:translateY(-4px) scale(1.12) rotate(4deg)}75%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1) rotate(-3deg)}}
.dust{fill:#fff;transform-box:fill-box;transform-origin:center;animation:dust .7s ease-out forwards;pointer-events:none}
@keyframes dust{from{transform:scale(.3);opacity:1}to{transform:scale(1.8) translate(-6px,-8px);opacity:0}}
.bob{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}

/* transición al pulsar JUGAR */
#grow{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;padding:28px;cursor:pointer}
#grow.on{display:flex}
.gIn{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:640px}
.gNum{font-family:'Super Waffles';font-size:24px}
.gName{font-size:clamp(54px,12vw,140px)}
.gJp{font-family:'Yusei Magic';font-size:clamp(22px,4vw,40px)}
.gTxt{font-weight:800;font-size:clamp(15px,2.4vh,20px)}
.gNew{align-items:center;text-align:center;padding:18px 24px 20px;font-weight:700;font-size:clamp(14px,2.2vh,18px);max-width:520px}
#grow small{font-weight:800;opacity:.75;margin-top:6px}

/* nivel de noche */
#night{position:fixed;inset:0;z-index:60;display:none;background:#07070b;touch-action:none}
#night.on{display:block}
#nsv{position:absolute;inset:0;width:100%;height:100%}
.nTitle{position:absolute;left:14px;top:14px;z-index:2;padding:14px 20px 16px;max-width:min(420px,calc(100vw - 100px));pointer-events:none}
.nTitle .lbl{font-size:clamp(24px,4.6vh,40px)}

<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const f=n=>Math.round(n*10)/10,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
function seeded(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function lum(h){const n=parseInt(h.slice(1),16),c=x=>{x/=255;return x<=.03928?x/12.92:((x+.055)/1.055)**2.4};return .2126*c(n>>16&255)+.7152*c(n>>8&255)+.0722*c(n&255)}
const inkOn=c=>lum(c)>.3?'#111111':'#fbe9c9';
const NS='http://www.w3.org/2000/svg';

/* ---------- bloques irregulares (mismo código que el juego) ---------- */
function irr(seed,amt=5,ph=0){
  const r=seeded((seed*2654435761)%4294967296),j=(k=1)=>r()*amt*k,m=Math.floor(r()*4),cap=Math.round(amt*2.4);
  const nr=seeded(seed*7+ph*7919+11),nz=k=>ph?(nr()-.5)*k:0;
  const lo=(pc,px=cap)=>`min(${f(Math.max(0,pc+nz(1.6)))}%,${f(Math.max(0,px+nz(4)))}px)`,hi=(pc,px=cap)=>`calc(100% - ${lo(pc,px)})`,mid=()=>f(35+r()*30+nz(2))+'%';
  const p=[[lo(j()),lo(j())],[mid(),lo(j(.5))],[hi(j()),lo(j())],[hi(j()),hi(j())],[mid(),hi(j(.5))],[lo(j()),hi(j())]];
  if(m===1){p[1]=[hi(amt*3+r()*10,cap*3),'0%'];p[2]=['100%',lo(amt*3+r()*10,cap*3)]}
  if(m===2){p[4]=[f(40+r()*20)+'%',hi(amt*1.6+r()*4,Math.round(cap*1.4))]}
  if(m===3){p[0]=[lo(amt*1.4+r()*4,Math.round(cap*1.4)),'0%'];p[2]=[hi(amt*1.4+r()*4,Math.round(cap*1.4)),'0%']}
  return'polygon('+p.map(([x,y])=>x+' '+y).join(',')+')';
}
function setIrr(el,seed,amt){el._cp=[0,1,2].map(ph=>irr(seed,amt,ph));el.style.clipPath=el._cp[0]}
function paint(el,c,amt=5){el.style.background=c;el.style.color=inkOn(c);setIrr(el,(+el.dataset.k||7)*17+3,amt)}
function shakeText(el){const txt=el.textContent;el.innerHTML=txt.split(' ').map(w=>'<span class="w">'+[...w].map(ch=>'<i class="sh" style="animation-delay:-'+f(Math.random()*.42)+'s">'+ch+'</i>').join('')+'</span>').join(' ')}

/* polígono irregular para los bloques del mapa (en unidades del SVG) */
function blkPts(w,h,seed,ph){
  const r=seeded((seed*2654435761)%4294967296),nr=seeded(seed*7+ph*7919+11),a=11,nz=k=>ph?(nr()-.5)*k:0,j=k=>r()*a*k;
  const L=-w/2,R=w/2,T=-h/2,B=h/2;
  const p=[[L+j(1)+nz(4),T+j(1)+nz(4)],[L+w*(.35+r()*.3)+nz(4),T+j(.5)+nz(3)],[R-j(1)+nz(4),T+j(1)+nz(4)],[R-j(1)+nz(4),B-j(1)+nz(4)],[L+w*(.35+r()*.3)+nz(4),B-j(.5)+nz(3)],[L+j(1)+nz(4),B-j(1)+nz(4)]];
  const m=Math.floor(r()*4);
  if(m===1){p[1]=[R-a*3-r()*12,T];p[2]=[R,T+a*3+r()*12]}
  if(m===2){p[4]=[L+w*(.4+r()*.2),B-a*1.6-r()*6]}
  if(m===3){p[0]=[L+a*1.4+r()*6,T];p[2]=[R-a*1.4-r()*6,T]}
  return p.map(q=>f(q[0])+','+f(q[1])).join(' ');
}
/* líneas a mano: subdividir, mover un poco y suavizar */
function jit(pts,amp,seed,step=40,closed=false){const r=seeded(seed),out=[],n=pts.length,last=closed?n:n-1;
  for(let i=0;i<last;i++){const a=pts[i],b=pts[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],k=Math.max(1,Math.round(Math.hypot(dx,dy)/step));
    for(let s=0;s<k;s++){const t=s/k,o=s?1:0;out.push([a[0]+dx*t+o*(r()-.5)*amp*2,a[1]+dy*t+o*(r()-.5)*amp*2])}}
  if(!closed)out.push(pts[n-1]);return out}
function cr(pts,closed=false){const n=pts.length,P=i=>closed?pts[(i+n)%n]:pts[clamp(i,0,n-1)];let d=`M${f(pts[0][0])} ${f(pts[0][1])}`;
  for(let i=0;i<(closed?n:n-1);i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);
    d+=`C${f(p1[0]+(p2[0]-p0[0])/6)} ${f(p1[1]+(p2[1]-p0[1])/6)} ${f(p2[0]-(p3[0]-p1[0])/6)} ${f(p2[1]-(p3[1]-p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`}
  return d+(closed?'Z':'')}
const hand=(pts,amp,seed,step,closed)=>cr(jit(pts,amp,seed,step,closed),closed);

      if(i<3){const[a2,y2]=bands[i+1];for(let x=-a2+8;x<=a2-8;x+=13){const t=(x+a)/(2*a),y=y0-32*t*(1-t)-6;if(i===1&&x>-62&&x<-30)continue;s+=`<path d="M${x} ${f(y)} l-2.5 -6 M${x} ${f(y)} l2.5 -6" stroke="${k}" stroke-width="2.2" stroke-linecap="round"/>`}}});

    <path d="M46 9 q6 -4 12 0 t12 0 t12 0 t12 0" fill="none" stroke="${k}" stroke-width="3" stroke-linecap="round"/>`,

      const d=`M${c.map(p=>f(p[0])+' '+f(p[1])).join(' L')}Z`;if(r()<.3)lit+=`<path d="${d}" fill="#f7cf3d"${r()<.25?' class="flk"':''}/>`;else scene+=`<path d="${d}" stroke-width="2"/>`}});
  // carretera en perspectiva
  scene+=`<path d="M60 700 L478 418 M940 700 L522 418"/>`;for(let i=0;i<7;i++){const t=i/7,t2=(i+.45)/7,y=(a)=>700-(282*(1-(1-a)**1.8));scene+=`<path d="M500 ${f(y(t))} L500 ${f(y(t2))}" stroke-width="${f(5-i*.6)}"/>`}
  // noria detrás
  let sp='',bl='';for(let i=0;i<10;i++){const a=i*Math.PI/5;sp+=`M640 210 L${f(640+Math.cos(a)*112)} ${f(210+Math.sin(a)*112)} `}
  for(let i=0;i<20;i++){const a=i*Math.PI/10;bl+=`<circle cx="${f(640+Math.cos(a)*112)}" cy="${f(210+Math.sin(a)*112)}" r="5" fill="${['#f7cf3d','#f4a3d3','#6ec6ee','#fbe9c9'][i%4]}"/>`}
  const rot=`<animateTransform attributeName="transform" type="rotate" from="0 640 210" to="360 640 210" dur="26s" repeatCount="indefinite"/>`;
  // farolas
  const LAMP=[[300,470,1],[700,470,-1]];let lamps='',lg='',holes='';
  LAMP.forEach(([x,y,s])=>{scene+=`<path d="M${x} 700 L${x} ${y} L${x+s*34} ${y}"/>`;lamps+=`<circle cx="${x+s*34}" cy="${y+5}" r="8" fill="#f7cf3d"/>`;lg+=`<circle cx="${x+s*34}" cy="${y+5}" r="70" fill="url(#glow)"/>`;holes+=`<circle cx="${x+s*24}" cy="${y+150}" r="150" fill="url(#hole)"/>`});
  $('#nsv').innerHTML=`<defs>
    <radialGradient id="hole"><stop offset="0" stop-color="#000"/><stop offset=".42" stop-color="#000" stop-opacity=".92"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f7cf3d" stop-opacity=".6"/><stop offset="1" stop-color="#f7cf3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <mask id="dark" maskUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="1100"><rect x="-200" y="-200" width="1400" height="1100" fill="#fff"/>${holes}
      <circle id="torch" cx="500" cy="350" r="160" fill="url(#hole)"/><polygon id="beamM" fill="url(#beam)" points="0,0 0,0 0,0"/></mask></defs>
    <rect x="-200" y="-200" width="1400" height="1100" fill="#1b1b2a"/>
    <g filter="url(#boilN)" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <g>${rot}<circle cx="640" cy="210" r="112"/><path d="${sp}" stroke-width="2"/></g><path d="M640 210 L590 425 M640 210 L690 425"/>${scene}
      <path d="M200 80 a34 34 0 1 0 30 52 a28 28 0 1 1 -30 -52z" fill="#fff"/></g>
    <rect x="-200" y="-200" width="1400" height="1100" fill="#07070b" opacity=".985" mask="url(#dark)"/>
    <g filter="url(#boilN)">${lit}<g>${rot}${bl}</g>${lg}${lamps}<path d="M200 80 a34 34 0 1 0 30 52 a28 28 0 1 1 -30 -52z" fill="#fbe9c9"/>
      <circle cx="80" cy="60" r="2.4" fill="#fff"/><circle cx="420" cy="40" r="2" fill="#fff"/><circle cx="880" cy="30" r="2.4" fill="#fff"/><circle cx="520" cy="110" r="1.8" fill="#fff"/></g>
    <g id="nCar"><g transform="scale(2.6)">${CAR.replace('id="carB"','')}</g></g>`;
}
function openNight(from){const N=$('#night');buildNight();N.classList.add('on');NT.on=true;NT.cx=-180;ai();ambStart('yokohama');
  const r=from.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,R=Math.hypot(innerWidth,innerHeight);
  N.animate([{clipPath:`circle(0px at ${x}px ${y}px)`},{clipPath:`circle(${R}px at ${x}px ${y}px)`}],{duration:620,easing:'cubic-bezier(.7,0,.25,1)'});
  let last=performance.now();const tick=ts=>{if(!NT.on)return;const dt=Math.min(50,ts-last);last=ts;NT.cx+=dt*.22;if(NT.cx>1200)NT.cx=-200;
    const cx=NT.cx,cy=640;$('#nCar').setAttribute('transform',`translate(${f(cx)} ${cy})`);
    $('#beamM').setAttribute('points',`${f(cx+70)},${cy-48} ${f(cx+480)},${cy-200} ${f(cx+480)},${cy+70} ${f(cx+70)},${cy-20}`);
    const T=$('#torch');T.setAttribute('cx',f(NT.tx));T.setAttribute('cy',f(NT.ty));NT.raf=requestAnimationFrame(tick)};NT.raf=requestAnimationFrame(tick);
}
function closeNight(){const N=$('#night');NT.on=false;cancelAnimationFrame(NT.raf);ambStop();N.classList.remove('on')}
$('#night').addEventListener('pointermove',e=>{const s=$('#nsv'),m=s.getScreenCTM();if(!m)return;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());NT.tx=p.x;NT.ty=p.y});
$('#night').addEventListener('pointerdown',e=>{const s=$('#nsv'),m=s.getScreenCTM();if(!m)return;const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());NT.tx=p.x;NT.ty=p.y});
$('#nClose').addEventListener('click',e=>{e.stopPropagation();SFX.click();closeNight()});

/* ---------- SONIDO: cada zona con su ambiente (sintetizado, de prueba) ---------- */
const AU={ctx:null};let AMB=null;
function ai(){if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=AU.ctx=new C();
  AU.m=c.createGain();AU.m.gain.value=.85;AU.m.connect(c.destination);const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b}
function tone(type,fq,t0,dur,vol,dest=AU.m,fq2){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(fq,t0);if(fq2)o.frequency.exponentialRampToValueAtTime(fq2,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.setValueAtTime(vol,t0+dur*.7);g.gain.exponentialRampToValueAtTime(.0005,t0+dur);o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+dur+.05)}
function noise(t0,dur,vol,ft,fq,q=1,dest=AU.m,fq2){const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;const fl=c.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(fq,t0);if(fq2)fl.frequency.exponentialRampToValueAtTime(fq2,t0+dur);fl.Q.value=q;
  const g=c.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0005,t0+dur);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t0,Math.random());s.stop(t0+dur+.05)}
function bell(f0,t0,vol,dest){const c=AU.ctx;[[1,1],[2.01,.5],[2.76,.36],[4.07,.2]].forEach(([m,v])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f0*m;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol*v,t0+.01);g.gain.exponentialRampToValueAtTime(.0005,t0+4.5/m+.6);o.connect(g);g.connect(dest);o.start(t0);o.stop(t0+5.2)})}
function horn(f1,t0,dur,vol,dest=AU.m){const c=AU.ctx,fl=c.createBiquadFilter(),g=c.createGain();fl.type='bandpass';fl.frequency.value=f1*2.2;fl.Q.value=.9;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.setValueAtTime(vol,t0+dur-.03);g.gain.linearRampToValueAtTime(0,t0+dur);
  for(const m of[1,1.26]){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f1*m;o.connect(fl);o.start(t0);o.stop(t0+dur+.02)}fl.connect(g);g.connect(dest)}
const SFX={
  click(){ai();if(!AU.ctx)return;const t=AU.ctx.currentTime;tone('triangle',1320,t,.06,.16);tone('triangle',1980,t+.03,.05,.08)},
  nope(){ai();if(!AU.ctx)return;const t=AU.ctx.currentTime;tone('square',190,t,.1,.07);tone('square',140,t+.11,.16,.07)},
  honk(){if(!AU.ctx)return;const t=AU.ctx.currentTime;horn(420,t,.13,.16);horn(420,t+.19,.2,.16)},
  brumOn(){if(!AU.ctx||AU.br)return;const c=AU.ctx,o=c.createOscillator(),fl=c.createBiquadFilter(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type='sawtooth';o.frequency.value=62;fl.type='lowpass';fl.frequency.value=420;g.gain.value=0;g.gain.linearRampToValueAtTime(.1,c.currentTime+.15);
    l.frequency.value=13;lg.gain.value=.05;l.connect(lg);lg.connect(g.gain);o.connect(fl);fl.connect(g);g.connect(AU.m);o.start();l.start();AU.br={o,g,l}},
  brumSet(k){if(AU.br)AU.br.o.frequency.setTargetAtTime(60+k*48,AU.ctx.currentTime,.05)},
  brumOff(){const B=AU.br;if(!B)return;AU.br=null;const t=AU.ctx.currentTime;B.g.gain.cancelScheduledValues(t);B.g.gain.setTargetAtTime(0,t,.06);setTimeout(()=>{try{B.o.stop();B.l.stop()}catch(e){}},400)}
};
function ambStop(){if(!AMB){paintSnd();return}const A=AMB;AMB=null;A.timers.forEach(clearTimeout);const t=AU.ctx.currentTime;A.g.gain.cancelScheduledValues(t);A.g.gain.setValueAtTime(A.g.gain.value,t);A.g.gain.linearRampToValueAtTime(0,t+.5);
  setTimeout(()=>{A.nodes.forEach(n=>{try{n.stop()}catch(e){}});A.g.disconnect()},650);paintSnd()}
function ambStart(id){ai();if(!AU.ctx)return;if(AMB){if(AMB.id===id)return;ambStop()}const c=AU.ctx,g=c.createGain();g.gain.value=0;g.connect(AU.m);g.gain.linearRampToValueAtTime(1,c.currentTime+1);
  const A=AMB={id,g,nodes:[],timers:[]};
  const bed=(type,fq,q,vol,lfoHz=0,lfoAmt=0)=>{const s=c.createBufferSource();s.buffer=AU.noise;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=fq;fl.Q.value=q;const gg=c.createGain();gg.gain.value=vol;
    s.connect(fl);fl.connect(gg);gg.connect(g);s.start(0,Math.random());A.nodes.push(s);if(lfoHz){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=lfoHz;lg.gain.value=lfoAmt;l.connect(lg);lg.connect(gg.gain);l.start();A.nodes.push(l)}};
  const every=(mn,mx,fn)=>{const go=()=>{if(AMB!==A)return;fn(c.currentTime+.03);A.timers.push(setTimeout(go,rand(mn,mx)))};A.timers.push(setTimeout(go,rand(150,700)))};
  if(id==='tokyo'){bed('lowpass',380,.7,.2,.1,.08);every(900,900,t=>{for(let n=0;n<2;n++){tone('sine',2700,t+n*.34,.1,.09);tone('sine',2050,t+n*.34+.14,.12,.08)}});every(2500,5000,t=>horn(rand(320,460),t,.18,.05,g))}
  if(id==='nikko'){bed('lowpass',1500,.5,.36);bed('highpass',3200,.5,.05);every(900,2800,t=>{const n=2+Math.floor(Math.random()*3),b=rand(2400,3200);for(let i=0;i<n;i++)tone('sine',b,t+i*.11,.08,.05,g,b*1.45)})}
  if(id==='chiba'){bed('bandpass',600,.8,.13,.13,.1);every(320,1100,t=>{const fq=rand(150,200),n=3+Math.floor(Math.random()*3);for(let i=0;i<n;i++)tone('square',fq,t+i*.055,.035,.045,g,fq*.8)})}
  if(id==='yokohama'){bed('lowpass',520,.8,.26,.22,.18);every(5200,8500,t=>{const fl=c.createBiquadFilter(),gg=c.createGain();fl.type='lowpass';fl.frequency.value=420;gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(.2,t+.25);gg.gain.setValueAtTime(.2,t+1.5);gg.gain.linearRampToValueAtTime(0,t+2.1);
    for(const fq of[82,123.5]){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=fq;o.connect(fl);o.start(t);o.stop(t+2.2)}fl.connect(gg);gg.connect(g)});every(2600,4800,t=>tone('sine',1480,t,.7,.025,g))}
  if(id==='kamakura'){bed('lowpass',900,.6,.3,.12,.27);bed('highpass',2600,.5,.05,.12,.04);every(6500,9500,t=>bell(146,t,.16,g))}
  if(id==='hakone'){bed('bandpass',360,1,.15,.09,.1);every(140,650,t=>{const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++){const fq=rand(320,720);tone('sine',fq,t+i*.07,.06,.06,g,fq*1.9)}})}
  if(id==='fuji'){bed('bandpass',1200,.6,.22,.2,.15);bed('highpass',4200,.4,.06);every(500,520,t=>noise(t,.09,.2,'bandpass',2300,1.2,g))}
  paintSnd()}
function paintSnd(){const on=AMB&&AMB.id===SEL,i=$('#pSndI');if(!i)return;
  i.innerHTML=on?'<rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor"/>':'<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>';
  $('#pSnd').setAttribute('aria-label',on?'Parar el sonido':'Escuchar la zona')}
$('#pSnd').addEventListener('click',()=>{ai();if(AMB&&AMB.id===SEL)ambStop();else ambStart(SEL)});
$('#pPlay').addEventListener('click',play);

/* ---------- giroscopio (y ratón en PC) ---------- */
const TILT={x:0,y:0,tx:0,ty:0,g0:null,b0:null,asked:false};
function onOri(e){if(e.gamma==null)return;if(TILT.g0==null){TILT.g0=e.gamma;TILT.b0=e.beta}TILT.tx=clamp((e.gamma-TILT.g0)/18,-1,1);TILT.ty=clamp((e.beta-TILT.b0)/18,-1,1)}
function tiltAsk(){if(TILT.asked)return;TILT.asked=true;const D=window.DeviceOrientationEvent;if(D&&typeof D.requestPermission==='function')D.requestPermission().then(s=>{if(s==='granted')addEventListener('deviceorientation',onOri)}).catch(()=>{})}
if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission!=='function')addEventListener('deviceorientation',onOri);
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){TILT.tx=(e.clientX/innerWidth-.5)*2;TILT.ty=(e.clientY/innerHeight-.5)*2}});
const DEPTH={L0:6,L1:12,L2:19,L4:19,L5:24,L3:28};
function tiltLoop(){TILT.x+=(TILT.tx-TILT.x)*.07;TILT.y+=(TILT.ty-TILT.y)*.07;const x=TILT.x,y=TILT.y;
  for(const id in DEPTH){const el=document.getElementById(id);if(el)el.style.transform=`translate(${f(-x*DEPTH[id])}px,${f(-y*DEPTH[id])}px)`}
  $('#panel').style.translate=`${f(x*9)}px ${f(y*7)}px`;$('#top').style.translate=`${f(-x*7)}px ${f(-y*5)}px`;$('#openAll').style.translate=`${f(-x*5)}px ${f(-y*4)}px`;
  requestAnimationFrame(tiltLoop)}

/* ---------- temblor: bordes y trazos cambian sin parar ---------- */
let BOIL=0;
setInterval(()=>{for(const id of['bt1','bt2','bt3','bt4']){const t=document.getElementById(id);if(t)t.setAttribute('seed',String(1+Math.floor(Math.random()*3)))}},150);
setInterval(()=>{BOIL=(BOIL+1)%3;$$('.blk').forEach(el=>{if(el._cp)el.style.clipPath=el._cp[BOIL]});
  $$('.zone').forEach(g=>{const z=ZM[g.dataset.id];g.querySelector('.zp').setAttribute('points',blkPts(z.w,z.h,z.seed,BOIL))});const fp=$('#frameP');if(fp)fp.setAttribute('points',framePts(BOIL))},180);

/* ---------- interacción ---------- */
$('#map').addEventListener('click',e=>{const g=e.target.closest('.zone');if(!g)return;ai();SFX.click();select(g.dataset.id)});
$('#map').addEventListener('keydown',e=>{if(e.key==='Enter'){const g=e.target.closest('.zone');if(g)select(g.dataset.id)}});
addEventListener('pointerdown',()=>{tiltAsk();ai()},{passive:true});
$('#openAll').addEventListener('click',()=>{SFX.click();ALL=!ALL;$('#openAll').innerHTML='<span>PRUEBA:</span> <span>'+(ALL?'VOLVER A CERRAR':'ABRIR TODO')+'</span>';
  $$('.zone').forEach(g=>{const i=+g.dataset.i,z=Z[i],lock=!isOpen(i),l=g.querySelector('.zlock');l.style.display=lock?'':'none';if(lock){l.classList.remove('pop');void l.getBBox();l.classList.add('pop')}
    g.querySelector('.zart').classList.toggle('dim',lock);g.querySelector('.zjp').setAttribute('x',z.w/2-((z.done||lock)?44:16))});
  if(!ALL&&CUR>OPEN){travel(OPEN)}fillPanel(ZM[SEL])});
$('#back').addEventListener('click',()=>{SFX.click();ambStop();
  $$('.zone').forEach((g,i)=>{g.style.setProperty('--o',(i*40)+'ms');g.classList.add('out')});
  const p=$('#panel'),por=innerHeight>innerWidth;p.animate([{transform:'none'},{transform:por?'translateY(120%) rotate(8deg)':'translateX(120%) rotate(10deg)'}],{duration:380,easing:'cubic-bezier(.55,0,.85,.35)',fill:'forwards'}).id='bk';
  setTimeout(()=>{$$('.zone').forEach(g=>{g.classList.remove('out');const zi=g.querySelector('.zin');zi.style.animation='none';void zi.getBBox();zi.style.animation=''});
    p.getAnimations().forEach(a=>{if(a.id==='bk')a.cancel()});panelSwapIn()},1100)});
function panelSwapIn(){const p=$('#panel'),por=innerHeight>innerWidth;fillPanel(ZM[SEL]);p.animate([{transform:por?'translateY(115%) rotate(-6deg)':'translateX(118%) rotate(-8deg)'},{transform:'none'}],{duration:680,easing:'cubic-bezier(.2,1.3,.4,1)'})}

/* ---------- arranque ---------- */
function start(){
  buildMap();paint($('#back'),'#fbe9c9',9);paint($('#top .ttl'),'#e52521',5);paint($('#openAll'),'#111111',6);paint($$('#night .nTitle')[0],'#f7cf3d',5);paint($('#nClose'),'#fbe9c9',9);
  $$('.ttl .ln').forEach(shakeText);shakeText($('#nT'));
  SEL='nikko';$$('.zone').forEach(g=>g.classList.toggle('sel',g.dataset.id===SEL));
  $('#top').animate([{transform:'translateY(-140%) rotate(-8deg)'},{transform:'none'}],{duration:700,easing:'cubic-bezier(.2,1.3,.4,1)'});
  $('#openAll').animate([{transform:'translateY(160%)'},{transform:'none'}],{duration:600,delay:900,easing:'cubic-bezier(.2,1.3,.4,1)',fill:'backwards'});
  setTimeout(panelSwapIn,350);requestAnimationFrame(tiltLoop);
}
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]):Promise.resolve()).then(start);
